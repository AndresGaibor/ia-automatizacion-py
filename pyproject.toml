[project]
name = "acumba-automation"
version = "2.18.0"
description = "Automatización para obtener reportes de campañas de email marketing de Acumbamail"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Andrés Gaibor"}
]

dependencies = [
    # Core dependencies for the executable
    "playwright==1.54.0",
    "pydantic==2.11.9",
    "pydantic-core==2.33.2",
    
    # Data processing
    "pandas==2.3.1",
    "openpyxl==3.1.5",
    "numpy==2.3.2",
    
    # HTTP and networking
    "httpx==0.27.0",
    "requests==2.32.5",
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "urllib3==2.5.0",
    
    # Async and networking support
    "anyio==4.10.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "sniffio==1.3.1",
    
    # Email validation
    "email-validator==2.3.0",
    
    # Logging and rich output
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "rich>=13.7.0",
    "colorama>=0.4.6",
    
    # Configuration and utilities
    "PyYAML==6.0.2",
    "typing-extensions==4.14.1",
    
    # Date and time handling
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "tzdata==2025.2",
    
    # IDNA support
    "idna==3.10",
    
    # PyInstaller hooks (needed for proper packaging)
    "pyinstaller-hooks-contrib==2025.8",
]

[project.optional-dependencies]
dev = [
    "ruff==0.12.8",
    "pyinstaller==6.15.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
exclude = [
    ".venv/",
    "__pycache__/",
    "*.pyc",
    ".git/",
    "tests/",
    "data/",
    "*.log",
]

[dependency-groups]
dev = [
    "ruff==0.12.8",
    "pyinstaller==6.15.0",
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
