# Catálogo de selectores - Suscriptores
---
pantalla: suscriptores
selectores:
  - clave: link_detalles_suscriptores
    descripcion: Link para ir a detalles de suscriptores
    selector_principal: 'a:has-text("Detalles suscriptores")'
    fallbacks:
      - 'a[href*="/subscribers/"]'
      - '[data-tab="subscribers"]'
    fragilidad: 3
    estado: ok
    nota: "Depende de texto visible. Si traducen a inglés, rompe."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<a href=\"/report/campaign/12345/subscribers/\">Detalles suscriptores</a>"

  - clave: tabla_suscriptores_ul
    descripcion: Contenedor UL de la tabla de suscriptores
    selector_principal: 'ul'
    fallbacks:
      - '.subscribers-table ul'
      - '#subscribers-list ul'
    fragilidad: 4
    estado: ok
    nota: "Muy genérico. Asume que hay un solo UL en la página."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<ul><li>...</li></ul>"

  - clave: fila_suscriptor
    descripcion: Fila individual de suscriptor (elemento LI)
    selector_principal: 'ul > li'
    fallbacks:
      - '.subscriber-row'
      - 'li[data-subscriber]'
    fragilidad: 4
    estado: ok
    nota: "Depende de estructura. Primera fila puede ser header."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<ul><li><div>email@ejemplo.com</div><div>Lista1</div>...</li></ul>"

  - clave: filtro_select
    descripcion: Select para elegir filtro (abiertos, no abiertos, etc)
    selector_principal: '#query-filter'
    fallbacks:
      - 'select[name="filter"]'
      - 'select.filter-select'
    fragilidad: 3
    estado: ok
    nota: "ID es bueno, pero puede cambiar si rediseñan el formulario."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<select id=\"query-filter\"><option>Abiertos</option></select>"

  - clave: filtro_opcion_abiertos
    descripcion: Opción de filtro para abiertos
    selector_principal: 'option:text("Abiertos")'
    fallbacks:
      - 'option[value="0"]'
    fragilidad: 3
    estado: ok
    nota: "Depende de texto visible y valor ordinal."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<option value=\"0\">Abiertos</option>"

  - clave: filtro_opcion_hard_bounces
    descripcion: Opción de filtro para hard bounces
    selector_principal: 'option:text("Hard bounces")'
    fallbacks:
      - 'option[value="1"]'
    fragilidad: 3
    estado: ok
    nota: "Depende de texto visible y valor ordinal."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<option value=\"1\">Hard bounces</option>"

  - clave: filtro_opcion_no_abiertos
    descripcion: Opción de filtro para no abiertos
    selector_principal: 'option:text("No abiertos")'
    fallbacks:
      - 'option[value="5"]'
    fragilidad: 3
    estado: ok
    nota: "Depende de texto visible y valor ordinal."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<option value=\"5\">No abiertos</option>"

  - clave: campo_correo
    descripcion: Campo de correo en fila (índice 0)
    selector_principal: 'ul > li > div:nth-child(1)'
    fallbacks:
      - '.subscriber-email'
      - 'li .email'
    fragilidad: 5
    estado: falla
    nota: "USA NTH() - frágil. Depende de posición en div."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div>email@ejemplo.com</div>"

  - clave: campo_lista
    descripcion: Campo de lista en fila (índice 1)
    selector_principal: 'ul > li > div:nth-child(2)'
    fallbacks:
      - '.subscriber-list'
    fragilidad: 5
    estado: falla
    nota: "USA NTH() - frágil."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div>Mi Lista</div>"

  - clave: campo_estado
    descripcion: Campo de estado en fila (índice 2)
    selector_principal: 'ul > li > div:nth-child(3)'
    fallbacks: []
    fragilidad: 5
    estado: falla
    nota: "USA NTH() - frágil."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div>Activo</div>"

  - clave: campo_calidad
    descripcion: Campo de calidad en fila (índice 3)
    selector_principal: 'ul > li > div:nth-child(4)'
    fallbacks: []
    fragilidad: 5
    estado: falla
    nota: "USA NTH() - frágil."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div>Alta</div>"

  - clave: total_elementos
    descripcion: Span que muestra total de suscriptores
    selector_principal: 'span.font-color-darkblue-1'
    fallbacks:
      - '.total-count'
    fragilidad: 3
    estado: ok
    nota: "Reutiliza selector común. Funciona si el span es único."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<span class=\"font-color-darkblue-1\">234</span>"