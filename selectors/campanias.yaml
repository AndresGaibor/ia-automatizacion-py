# Catálogo de selectores - Campañas
# Cada selector tiene: clave, descripción, selector principal, fallbacks, fragilidad, nota
---
pantalla: campanias
selectores:
  - clave: fila_campania_link
    descripcion: Link a página de reporte de campaña
    selector_principal: 'a[href*="/report/campaign/"]'
    fallbacks:
      - 'li a[href*="/report/campaign/"]'
      - '.campaign-link'
    fragilidad: 2
    estado: ok
    nota: "Usa href con patrón estable. Fragilidad 2 porque depende de estructura URL."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<a href=\"/report/campaign/12345/\">Nombre Campaña</a>"

  - clave: fila_fecha
    descripcion: Celda de fecha en fila de campaña (índice fijo)
    selector_principal: 'div.am-responsive-table-cell:nth-child(3) span'
    fallbacks:
      - 'div.am-responsive-table-cell:nth-child(3)'
      - 'td:nth-child(3)'
    fragilidad: 5
    estado: falla
    nota: "USA NTH() - muy frágil. Si agregan/quitan columnas, rompe todo."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div class=\"am-responsive-table-cell\"><span>15/01/2024</span></div>"

  - clave: fila_total_enviado
    descripcion: Celda de total enviado en fila de campaña (índice 5)
    selector_principal: 'div.am-responsive-table-cell:nth-child(6)'
    fallbacks:
      - 'td:nth-child(6)'
    fragilidad: 5
    estado: falla
    nota: "USA NTH() con índice 6. Muy frágil a cambios de columnas."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div class=\"am-responsive-table-cell\"><span>1,234</span></div>"

  - clave: fila_abierto
    descripcion: Celda de abiertos en fila de campaña (índice 6)
    selector_principal: 'div.am-responsive-table-cell:nth-child(7)'
    fallbacks:
      - 'td:nth-child(7)'
    fragilidad: 5
    estado: falla
    nota: "USA NTH() con índice 7. Muy frágil a cambios de columnas."
    origen: manual
    ultima_validacion: null
    ejemplo_dom: "<div class=\"am-responsive-table-cell\"><span>456</span></div>"

  - clave: lista_campanias
    descripcion: Contenedor de lista de campañas
    selector_principal: 'ul li'
    fallbacks:
      - '.campaign-list li'
      - '[data-campaign-list] li'
    fragilidad: 4
    estado: ok
    nota: "Genérico pero aceptable para contenedor. Luego se filtra por link de campaña."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<ul><li><a href=\"/report/campaign/12345/\">...</a></li></ul>"

  - clave: paginacion_siguiente
    descripcion: Botón de siguiente página
    selector_principal: 'ul.pagination .next:not(.disabled)'
    fallbacks:
      - 'a:has-text("Siguiente")'
      - '.pagination-next'
    fragilidad: 3
    estado: ok
    nota: "Depende de texto 'Siguiente' y clase CSS. frágil medio."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<ul class=\"pagination\"><li class=\"next\"><a>Siguiente</a></li></ul>"

  - clave: total_elementos
    descripcion: Span que muestra total de elementos
    selector_principal: 'span.font-color-darkblue-1'
    fallbacks:
      - '.total-count'
      - '[data-total]'
    fragilidad: 3
    estado: ok
    nota: "Depende de clase CSS de estilo. Podría cambiar si redesignan."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<span class=\"font-color-darkblue-1\">45</span>"

  - clave: items_por_pagina
    descripcion: Select para cambiar items por página
    selector_principal: 'select'
    fallbacks:
      - '#items-per-page'
      - 'select[name="per_page"]'
    fragilidad: 4
    estado: ok
    nota: "Muy genérico. Funciona si solo hay un select en página."
    origen: verificado
    ultima_validacion: "2026-06-01"
    ejemplo_dom: "<select><option>15</option></select>"